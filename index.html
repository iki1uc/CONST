<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>CONTINIUM · Unified OS · iki1uc</title>

<style>
body {
    margin:0;
    background:#000;
    color:#0f0;
    font-family:Consolas, monospace;
}
#out {
    position:absolute;
    top:20px;
    left:20px;
    width:360px;
    height:420px;
    overflow:auto;
    background:#111;
    border-left:3px solid #6cf;
    padding:15px;
}
canvas {
    display:block;
}
</style>

<script type="module">
import { QUANT } from "./CONST_QUANT.js";          // dein Quantifizierer
import { CONTINIUM_KEY } from "./CONTINIUM_KEY.js";
import { LAUF } from "./lauf.js";
import { orbitTick } from "./orbitTick.js";
import {
    WHIRL,
    PIPELINE_3_6,
    CONTINIUM_TRUTH
} from "./um.js";

/* ======================================================
   QUANTIFIER START
   ====================================================== */
QUANT.start();

/* ======================================================
   CANVAS
   ====================================================== */
const cv = document.createElement("canvas");
cv.width = window.innerWidth;
cv.height = window.innerHeight;
document.body.appendChild(cv);
const ctx = cv.getContext("2d");

/* ======================================================
   TEXT‑OUTPUT
   ====================================================== */
const out = document.createElement("pre");
out.id = "out";
out.textContent = "Starte CONTINIUM OS…";
document.body.appendChild(out);

/* ======================================================
   ATOM‑Beweis Animation
   ====================================================== */
function ATOM_ANIM(t){
    const seq = QUANT.atom.seq;
    return seq[Math.floor((t*10) % seq.length)];
}

/* ======================================================
   Singularität
   ====================================================== */
function SINGULAR_VIEW(t){
    const p = CONTINIUM_KEY.pos(t);
    const s = QUANT.singular(p);
    return { p, s };
}

/* ======================================================
   VISUAL DRAW
   ====================================================== */
function draw(scene){
    ctx.clearRect(0,0,cv.width,cv.height);

    const cx = cv.width/2;
    const cy = cv.height/2;

    // QS‑XI‑XTender Dreieck (SYN + QUANDT)
    ctx.strokeStyle = "#6cf";
    ctx.beginPath();
    ctx.moveTo(cx + scene.qsxi.tokio.x/30, cy + scene.qsxi.tokio.y/30);
    ctx.lineTo(cx + scene.qsxi.corlu.x/30, cy + scene.qsxi.corlu.y/30);
    ctx.lineTo(cx + scene.qsxi.hh.x/30,    cy + scene.qsxi.hh.y/30);
    ctx.closePath();
    ctx.stroke();

    // ATOM‑Beweis
    ctx.fillStyle = "#0f0";
    ctx.font = "32px Consolas";
    ctx.fillText(scene.atom, cx - 16, cy - 16);

    // Singularität (Schwarzes Loch)
    ctx.strokeStyle = "#f00";
    ctx.beginPath();
    ctx.arc(cx, cy, scene.singular.s.radius/300, 0, Math.PI*2);
    ctx.stroke();
}
